name: Build installer dan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  installer-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Isi alamat GitHub untuk cek update
        shell: bash
        run: node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));p.updateRepo=process.env.GITHUB_REPOSITORY;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: npm install
      - run: npm run dist
      # archive: false membuat file .exe bisa diunduh langsung, tanpa zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/gatito-stream-tool-v*.exe
          archive: false

  apk-hp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          path: mobile/gatito-stream-tool-v*.apk
          archive: false
